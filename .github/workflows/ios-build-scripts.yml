name: Build FFmpegKit iOS Full GPL

on:
  workflow_dispatch:
  push:
    branches:
      - development
      - main
    paths:
      - '.github/workflows/ios-build-scripts.yml'
      - 'apple/**'
      - 'scripts/**'
      - 'tools/**'
      - 'apple.sh'
      - 'ios.sh'

permissions:
  contents: write

env:
  VERSION: "6.0"
  VARIANT: "full-gpl"

jobs:
  build-ios-full-gpl:
    name: Build iOS Full GPL
    runs-on: macos-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install prerequisites
        run: |
          brew install autoconf automake libtool pkg-config curl git cmake nasm make meson ninja

      - name: Set up Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Build FFmpegKit full-gpl
        run: |
          rm -rf prebuilt .tmp build.log

          chmod +x ./ios.sh

          bash -x ./ios.sh -x --enable-gpl --target=16.0 --disable-armv7 --disable-armv7s --disable-arm64e --disable-i386 --disable-x86-64 --disable-x86-64-mac-catalyst --disable-arm64-mac-catalyst  --disable-arm64-simulator 

      - name: Prepare artifact
        run: |
          mkdir -p output
          cd prebuilt/bundle-apple-xcframework-ios
          zip -qry "$GITHUB_WORKSPACE/output/ffmpeg-kit-${VARIANT}-${VERSION}-ios-xcframework.zip" ./*.xcframework
          ls -lh "$GITHUB_WORKSPACE/output"

      - name: Upload FFmpegKit artifact
        uses: actions/upload-artifact@v6
        with:
          name: ffmpeg-kit-${{ env.VARIANT }}-${{ env.VERSION }}-ios-xcframework
          path: output/ffmpeg-kit-${{ env.VARIANT }}-${{ env.VERSION }}-ios-xcframework.zip
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2.5.0
        with:
          tag_name: v${{ env.VERSION }}
          name: FFmpegKit ${{ env.VERSION }} ${{ env.VARIANT }} iOS XCFramework
          files: output/ffmpeg-kit-${{ env.VARIANT }}-${{ env.VERSION }}-ios-xcframework.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Print build log
        if: always()
        run: |
          [ -f build.log ] && cat build.log || true

      - name: Print FFmpeg config log
        if: failure()
        run: |
          [ -f ./src/ffmpeg/ffbuild/config.log ] && tail -100 ./src/ffmpeg/ffbuild/config.log || true
